---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_PYTHON: '3.14'
  # Each job installs its dependencies with `uv sync` first, so stop `uv run`
  # from syncing again. Otherwise it would install the full dev group in the
  # lint jobs, which only install the lint group
  UV_NO_SYNC: '1'

jobs:
  codespell:
    name: Codespell
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: lint
      - name: 🏗 Install Python dependencies
        run: uv sync --locked --only-group lint
      - name: 🚀 Check code for common misspellings
        run: uv run pre-commit run codespell --all-files

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: lint
      - name: 🏗 Install Python dependencies
        run: uv sync --locked --only-group lint
      - name: 🚀 Run Ruff
        run: uv run ruff check .

  black:
    name: Black
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: lint
      - name: 🏗 Install Python dependencies
        run: uv sync --locked --only-group lint
      - name: 🚀 Check code formatting with black
        run: uv run pre-commit run black --all-files
      - name: 🚀 Run black on docs
        run: uv run pre-commit run blacken-docs --all-files

  pre-commit-hooks:
    name: Pre Commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: lint
      - name: 🏗 Install Python dependencies
        run: uv sync --locked --only-group lint
      - name: 🏗 Cache pre-commit hook environments
        # The Renovate validator hook installs Node.js and Renovate, which
        # takes about a minute when it isn't cached
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: 🚀 Check Python AST
        run: uv run pre-commit run check-ast --all-files
      - name: 🚀 Check for case conflicts
        run: uv run pre-commit run check-case-conflict --all-files
      - name: 🚀 Check docstring is first
        run: uv run pre-commit run check-docstring-first --all-files
      - name: 🚀 Check that executables have shebangs
        run: uv run pre-commit run check-executables-have-shebangs --all-files
      - name: 🚀 Check JSON files
        run: uv run pre-commit run check-json --all-files
      - name: 🚀 Check for merge conflicts
        run: uv run pre-commit run check-merge-conflict --all-files
      - name: 🚀 Check for broken symlinks
        run: uv run pre-commit run check-symlinks --all-files
      - name: 🚀 Check TOML files
        run: uv run pre-commit run check-toml --all-files
      - name: 🚀 Check XML files
        run: uv run pre-commit run check-xml --all-files
      - name: 🚀 Check YAML files
        run: uv run pre-commit run check-yaml --all-files
      - name: 🚀 Detect Private Keys
        run: uv run pre-commit run detect-private-key --all-files
      - name: 🚀 Check End of Files
        run: uv run pre-commit run end-of-file-fixer --all-files
      - name: 🚀 Trim Trailing Whitespace
        run: uv run pre-commit run trailing-whitespace --all-files
      - name: 🚀 Check Renovate configuration
        run: uv run pre-commit run renovate-config-validator --all-files

  mypy:
    name: MyPy
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: test
      - name: 🏗 Install Python dependencies
        run: uv sync --locked
      - name: 🏗 Cache mypy results
        # mypy only rechecks what changed since the cached run. A new lock file
        # starts from the newest cache for the old one, which mypy checks is
        # still valid
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ env.DEFAULT_PYTHON }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ env.DEFAULT_PYTHON }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-${{ env.DEFAULT_PYTHON }}-
      - name: 🚀 Run mypy
        run: uv run mypy

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: lint
      - name: 🏗 Install Python dependencies
        run: uv sync --locked --only-group lint
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: 🏗 Install NPM dependencies
        # Installs exactly what package-lock.json lists, from the npm cache
        run: npm ci
      - name: 🚀 Run prettier
        run: uv run pre-commit run prettier --all-files

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: test
      - name: 🏗 Install Python dependencies
        run: uv sync --locked
      - name: 🚀 Run pytest
        run: uv run pytest

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          # The lint and test jobs install different groups, so they keep
          # separate caches
          enable-cache: true
          cache-suffix: lint
      - name: 🏗 Install Python dependencies
        run: uv sync --locked --only-group lint
      - name: 🚀 Run yamllint
        run: uv run pre-commit run yamllint --all-files
